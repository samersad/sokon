flutter_launcher_icons:
  android: true
  min_sdk_android: 21

  adaptive_icon_background: "#3075CC"
  adaptive_icon_foreground: "assets/images/appLogo.png"

  ios: true
  image_path: "assets/images/appLogo.png"
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/images/appLogo.png"

  windows:
    generate: true
    image_path: "assets/images/appLogo.png"
    icon_size: 128

  macos:
    generate: true
    image_path: "assets/images/appLogo.png"
